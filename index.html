<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Number Guessing Game</title>
    <style>
        :root {
            --neon: #4bff96;
            --neon-soft: rgba(75, 255, 150, 0.15);
            --neon-border: rgba(75, 255, 150, 0.3);
            --card: rgba(3, 10, 4, 0.8);
            --warn: #ffc107;
            --bad: #ff5c7a;
            --cold: #5cc8ff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0;
            min-height: 100%;
            background: #010301;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 14px;
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 10%, rgba(75, 255, 150, 0.12), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(75, 255, 150, 0.08), transparent 45%),
                #010301;
            overflow-x: hidden;
        }

        canvas#bg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

        .game {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border: 1px solid var(--neon-border);
            border-radius: 18px;
            padding: 26px 22px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(75, 255, 150, 0.12), 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .game::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon), transparent);
            opacity: 0.6;
        }

        h1 {
            margin: 0 0 4px;
            text-align: center;
            font-size: clamp(1.6rem, 6vw, 2.1rem);
            font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, var(--neon) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle { text-align: center; margin: 0 0 20px; color: #9ea7b0; font-size: 0.95rem; }

        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
        .stat {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--neon-border);
            border-radius: 10px;
            padding: 10px 6px;
            text-align: center;
        }
        .stat .label { font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; color: #8b97a3; }
        .stat .value { font-size: 1.4rem; font-weight: 800; color: var(--neon); margin-top: 2px; }

        /* Attempt dots */
        .dots { display: flex; justify-content: center; gap: 7px; margin-bottom: 16px; flex-wrap: wrap; }
        .dot {
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--neon);
            box-shadow: 0 0 8px var(--neon);
            transition: all 0.35s ease;
        }
        .dot.used { background: #1a2a1f; box-shadow: none; border: 1px solid rgba(75, 255, 150, 0.2); transform: scale(0.8); }

        /* Message box */
        .message {
            min-height: 78px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--neon-border);
            transition: all 0.3s ease;
        }
        .message .big { font-size: 1.15rem; font-weight: 700; }
        .message .small { font-size: 0.85rem; color: #a0aec0; margin-top: 4px; }
        .message.high { border-color: rgba(255, 92, 122, 0.6); }
        .message.high .big { color: var(--bad); }
        .message.low { border-color: rgba(92, 200, 255, 0.6); }
        .message.low .big { color: var(--cold); }
        .message.win { border-color: var(--neon); box-shadow: 0 0 20px rgba(75, 255, 150, 0.3); }
        .message.win .big { color: var(--neon); }
        .message.lose { border-color: var(--bad); }
        .message.lose .big { color: var(--bad); }
        .message.shake { animation: shake 0.4s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* Input */
        .input-row { display: flex; gap: 10px; margin-bottom: 16px; }
        .input-row input {
            flex: 1;
            min-width: 0;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--neon-border);
            border-radius: 10px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            padding: 12px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .input-row input:focus { border-color: var(--neon); box-shadow: 0 0 12px rgba(75, 255, 150, 0.3); }
        .input-row input::placeholder { color: rgba(255, 255, 255, 0.3); font-weight: 400; font-size: 0.95rem; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        button.btn {
            background: var(--neon);
            color: #03120a;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1rem;
            padding: 12px 22px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }
        button.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 0 18px rgba(75, 255, 150, 0.6); }
        button.btn:disabled { opacity: 0.4; cursor: not-allowed; }
        button.btn.ghost { background: transparent; color: var(--neon); border: 1px solid var(--neon-border); }

        /* Number grid */
        .grid-title { font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; color: #8b97a3; margin-bottom: 8px; }
        .number-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 18px; }
        .num {
            background: rgba(75, 255, 150, 0.06);
            border: 1px solid var(--neon-border);
            color: #fff;
            border-radius: 8px;
            padding: 10px 0;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .num:hover:not(:disabled) { background: var(--neon-soft); border-color: var(--neon); transform: translateY(-2px); }
        .num.selected { background: var(--neon); color: #03120a; }
        .num.high { background: rgba(255, 92, 122, 0.12); border-color: rgba(255, 92, 122, 0.5); color: var(--bad); }
        .num.low { background: rgba(92, 200, 255, 0.12); border-color: rgba(92, 200, 255, 0.5); color: var(--cold); }
        .num.correct { background: var(--neon); color: #03120a; box-shadow: 0 0 14px var(--neon); }
        .num:disabled { cursor: not-allowed; opacity: 0.45; }
        .num.correct:disabled { opacity: 1; }

        /* History */
        .history { display: flex; flex-wrap: wrap; gap: 8px; min-height: 30px; margin-bottom: 18px; }
        .chip {
            font-size: 0.85rem;
            font-weight: 700;
            padding: 5px 11px;
            border-radius: 20px;
            border: 1px solid;
            animation: pop 0.3s ease;
        }
        .chip.high { color: var(--bad); border-color: rgba(255, 92, 122, 0.5); background: rgba(255, 92, 122, 0.1); }
        .chip.low { color: var(--cold); border-color: rgba(92, 200, 255, 0.5); background: rgba(92, 200, 255, 0.1); }
        .chip.correct { color: #03120a; background: var(--neon); border-color: var(--neon); }
        .empty-hint { color: #5d6a75; font-size: 0.85rem; align-self: center; }
        @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .footer-row { display: flex; gap: 10px; }
        .footer-row .btn { flex: 1; }

        /* Result overlay */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            z-index: 50;
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .overlay.show { opacity: 1; visibility: visible; }
        .modal {
            width: 100%; max-width: 360px;
            background: #030a04;
            border: 1px solid var(--neon);
            border-radius: 16px;
            padding: 28px 22px;
            text-align: center;
            box-shadow: 0 0 40px rgba(75, 255, 150, 0.25);
            transform: scale(0.85);
            transition: transform 0.3s;
        }
        .overlay.show .modal { transform: scale(1); }
        .modal.lose { border-color: var(--bad); box-shadow: 0 0 40px rgba(255, 92, 122, 0.25); }
        .modal .emoji { font-size: 3rem; }
        .modal h2 { margin: 8px 0 6px; font-size: 1.6rem; color: var(--neon); }
        .modal.lose h2 { color: var(--bad); }
        .modal p { margin: 0 0 6px; color: #a0aec0; }
        .modal .answer { font-size: 2.6rem; font-weight: 800; color: #fff; margin: 8px 0 14px; text-shadow: 0 0 18px var(--neon); }
        .modal .btn { width: 100%; margin-top: 8px; }

        @media (max-width: 380px) {
            .game { padding: 20px 14px; }
            .number-grid { gap: 6px; }
        }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>

    <main class="game">
        <h1>Guess The Number</h1>
        <p class="subtitle">I'm thinking of a number between <strong>1</strong> and <strong>20</strong>.</p>

        <div class="stats">
            <div class="stat"><div class="label">Attempts Left</div><div class="value" id="attemptsLeft">10</div></div>
            <div class="stat"><div class="label">Used</div><div class="value" id="attemptsUsed">0</div></div>
            <div class="stat"><div class="label">Best Score</div><div class="value" id="bestScore">–</div></div>
        </div>

        <div class="dots" id="dots"></div>

        <div class="message" id="message">
            <div class="big">Ready? Make your first guess!</div>
            <div class="small">Type a number or tap one below.</div>
        </div>

        <div class="input-row">
            <input type="number" id="guessInput" min="1" max="20" placeholder="Enter 1 - 20" inputmode="numeric">
            <button class="btn" id="guessBtn">Guess</button>
        </div>

        <div class="grid-title">Pick a number</div>
        <div class="number-grid" id="numberGrid"></div>

        <div class="grid-title">Your guesses</div>
        <div class="history" id="history"><span class="empty-hint">No guesses yet.</span></div>

        <div class="footer-row">
            <button class="btn ghost" id="restartBtn">Restart Game</button>
        </div>
    </main>

    <!-- Result modal -->
    <div class="overlay" id="overlay">
        <div class="modal" id="modal">
            <div class="emoji" id="modalEmoji">🎉</div>
            <h2 id="modalTitle">You won!</h2>
            <p id="modalText"></p>
            <div class="answer" id="modalAnswer">0</div>
            <button class="btn" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script>
        const MIN = 1, MAX = 20, MAX_ATTEMPTS = 10;

        let secret, attemptsUsed, finished, guessedNumbers;

        const el = {
            left: document.getElementById('attemptsLeft'),
            used: document.getElementById('attemptsUsed'),
            best: document.getElementById('bestScore'),
            dots: document.getElementById('dots'),
            message: document.getElementById('message'),
            input: document.getElementById('guessInput'),
            guessBtn: document.getElementById('guessBtn'),
            grid: document.getElementById('numberGrid'),
            history: document.getElementById('history'),
            restart: document.getElementById('restartBtn'),
            overlay: document.getElementById('overlay'),
            modal: document.getElementById('modal'),
            modalEmoji: document.getElementById('modalEmoji'),
            modalTitle: document.getElementById('modalTitle'),
            modalText: document.getElementById('modalText'),
            modalAnswer: document.getElementById('modalAnswer'),
            playAgain: document.getElementById('playAgainBtn')
        };

        // ---- Best score (saved in browser, safe if storage is blocked) ----
        function getBest() {
            try { return parseInt(localStorage.getItem('guessBest'), 10) || null; } catch (e) { return null; }
        }
        function saveBest(n) {
            try { localStorage.setItem('guessBest', String(n)); } catch (e) {}
        }

        function setMessage(big, small, type) {
            el.message.className = 'message' + (type ? ' ' + type : '');
            el.message.innerHTML = `<div class="big">${big}</div><div class="small">${small}</div>`;
            if (type === 'high' || type === 'low') {
                void el.message.offsetWidth;
                el.message.classList.add('shake');
            }
        }

        function buildDots() {
            el.dots.innerHTML = '';
            for (let i = 0; i < MAX_ATTEMPTS; i++) {
                const d = document.createElement('div');
                d.className = 'dot' + (i < attemptsUsed ? ' used' : '');
                el.dots.appendChild(d);
            }
        }

        function buildGrid() {
            el.grid.innerHTML = '';
            for (let n = MIN; n <= MAX; n++) {
                const b = document.createElement('button');
                b.className = 'num';
                b.textContent = n;
                b.dataset.n = n;
                b.addEventListener('click', () => {
                    if (finished || guessedNumbers.has(n)) return;
                    el.input.value = n;
                    submitGuess();
                });
                el.grid.appendChild(b);
            }
        }

        function updateStats() {
            el.left.textContent = MAX_ATTEMPTS - attemptsUsed;
            el.used.textContent = attemptsUsed;
            const best = getBest();
            el.best.textContent = best ? best : '–';
            buildDots();
        }

        function addHistory(n, type) {
            const empty = el.history.querySelector('.empty-hint');
            if (empty) empty.remove();
            const chip = document.createElement('span');
            chip.className = 'chip ' + type;
            chip.textContent = n + (type === 'high' ? ' ↓' : type === 'low' ? ' ↑' : ' ✓');
            el.history.appendChild(chip);
        }

        function markGridNumber(n, type) {
            const btn = el.grid.querySelector(`[data-n="${n}"]`);
            if (!btn) return;
            btn.classList.add(type);
            btn.disabled = true;
        }

        function submitGuess() {
            if (finished) return;
            const raw = el.input.value.trim();
            const n = Number(raw);

            if (raw === '' || !Number.isInteger(n) || n < MIN || n > MAX) {
                setMessage('Invalid number', `Please enter a whole number from ${MIN} to ${MAX}.`, 'high');
                return;
            }
            if (guessedNumbers.has(n)) {
                setMessage('Already tried!', `You already guessed ${n}. Try a different number.`, 'high');
                return;
            }

            guessedNumbers.add(n);
            attemptsUsed++;
            el.input.value = '';

            if (n === secret) {
                addHistory(n, 'correct');
                markGridNumber(n, 'correct');
                updateStats();
                setMessage('🎯 Correct!', `You got it in ${attemptsUsed} attempt${attemptsUsed > 1 ? 's' : ''}.`, 'win');
                endGame(true);
                return;
            }

            const diff = Math.abs(n - secret);
            const type = n > secret ? 'high' : 'low';
            const heat = diff <= 2 ? '🔥 Very hot!' : diff <= 5 ? '♨️ Getting warm' : '❄️ Cold';
            addHistory(n, type);
            markGridNumber(n, type);
            updateStats();

            const left = MAX_ATTEMPTS - attemptsUsed;
            if (left === 0) {
                setMessage('Out of attempts!', `The number was ${secret}.`, 'lose');
                endGame(false);
                return;
            }

            setMessage(
                n > secret ? 'Too high! Go lower ↓' : 'Too low! Go higher ↑',
                `${heat} · ${left} attempt${left > 1 ? 's' : ''} left`,
                type
            );
            el.input.focus();
        }

        function endGame(won) {
            finished = true;
            el.guessBtn.disabled = true;
            el.input.disabled = true;
            el.grid.querySelectorAll('.num').forEach(b => b.disabled = true);

            if (won) {
                const best = getBest();
                if (!best || attemptsUsed < best) { saveBest(attemptsUsed); updateStats(); }
                el.modal.classList.remove('lose');
                el.modalEmoji.textContent = '🎉';
                el.modalTitle.textContent = 'You Won!';
                el.modalText.textContent = `You found it in ${attemptsUsed} attempt${attemptsUsed > 1 ? 's' : ''}.`;
                launchConfetti();
            } else {
                el.modal.classList.add('lose');
                el.modalEmoji.textContent = '😢';
                el.modalTitle.textContent = 'Game Over';
                el.modalText.textContent = 'You used all 10 attempts. The number was:';
            }
            el.modalAnswer.textContent = secret;
            setTimeout(() => el.overlay.classList.add('show'), 700);
        }

        function newGame() {
            secret = Math.floor(Math.random() * (MAX - MIN + 1)) + MIN;
            attemptsUsed = 0;
            finished = false;
            guessedNumbers = new Set();

            el.overlay.classList.remove('show');
            el.guessBtn.disabled = false;
            el.input.disabled = false;
            el.input.value = '';
            el.history.innerHTML = '<span class="empty-hint">No guesses yet.</span>';
            setMessage('Ready? Make your first guess!', 'Type a number or tap one below.');
            buildGrid();
            updateStats();
            el.input.focus();
        }

        el.guessBtn.addEventListener('click', submitGuess);
        el.input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitGuess(); });
        el.restart.addEventListener('click', newGame);
        el.playAgain.addEventListener('click', newGame);

        // ---- Confetti ----
        const bg = document.getElementById('bg');
        const ctx = bg.getContext('2d');
        let W, H, particles = [], stars = [], confetti = [];

        function resize() {
            W = bg.width = innerWidth;
            H = bg.height = innerHeight;
            stars = Array.from({ length: Math.floor(W * H / 14000) }, () => ({
                x: Math.random() * W, y: Math.random() * H,
                r: 0.5 + Math.random() * 1.2, p: Math.random() * 6.28, s: 0.5 + Math.random()
            }));
        }
        resize();
        window.addEventListener('resize', resize);

        function launchConfetti() {
            const colors = ['#4bff96', '#ffffff', '#ffc107', '#5cc8ff', '#ff5c7a'];
            for (let i = 0; i < 130; i++) {
                confetti.push({
                    x: W / 2, y: H / 2.5,
                    vx: (Math.random() - 0.5) * 14,
                    vy: Math.random() * -13 - 3,
                    size: 4 + Math.random() * 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1
                });
            }
        }

        function loop(t) {
            ctx.clearRect(0, 0, W, H);
            stars.forEach(s => {
                const a = 0.15 + 0.3 * (0.5 + 0.5 * Math.sin(t / 700 * s.s + s.p));
                ctx.fillStyle = `rgba(75,255,150,${a})`;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
            });
            confetti = confetti.filter(c => c.life > 0);
            confetti.forEach(c => {
                c.x += c.vx; c.y += c.vy; c.vy += 0.35; c.vx *= 0.99; c.life -= 0.008;
                ctx.globalAlpha = Math.max(c.life, 0);
                ctx.fillStyle = c.color;
                ctx.fillRect(c.x, c.y, c.size, c.size * 0.6);
            });
            ctx.globalAlpha = 1;
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);

        newGame();
    </script>
</body>
</html>
